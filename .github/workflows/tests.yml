name: Tests

# Prüft jede Änderung automatisch: Backend (mit nachgebildeten Google-Diensten),
# Sicherheitstest und die App im echten Browser (Chromium).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Backend und Sicherheit
        run: npm run test:backend
      - name: App im Browser
        run: npm run test:frontend
